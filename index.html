<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A music-reactive visualizer with orbit, spectrum and waveform views. Play a synthetic beat, open your music, or use a microphone.">
  <title>Pulse Lab — Music Visualizer</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
<main>
<p class="eyebrow">SOUND IN MOTION</p>
<div id="pulse-lab">
  <div class="viz-row"><h1>Pulse lab</h1><span id="pl-status" class="text-small" aria-live="polite">Ready · synthetic demo</span></div>
  <canvas id="pl-canvas" role="img" aria-label="Audio-reactive spectrum with orbit and waveform views">Audio-reactive visualizer</canvas>
  <div class="viz-controls">
    <button id="pl-play" class="btn btn-primary" type="button">Play demo</button>
    <button id="pl-mic" class="btn" type="button">Use microphone</button>
    <button id="pl-stop" class="btn" type="button">Stop</button>
  </div>
  <div class="viz-controls">
    <label class="form-label">Your music<input id="pl-file" class="form-control" type="file" accept="audio/*"></label>
    <label class="form-label">Visual style<select id="pl-style" class="form-select"><option value="orbit">Orbit</option><option value="bars">Spectrum</option><option value="wave">Waveform</option></select></label>
    <label class="form-label">Sensitivity <span id="pl-gain-label">1.5×</span><input id="pl-gain" class="form-range" type="range" min="0.5" max="3" step="0.1" value="1.5"></label>
    <label class="form-label">Volume <span id="pl-volume-label">30%</span><input id="pl-volume" class="form-range" type="range" min="0" max="1" step="0.05" value="0.3"></label>
  </div>
  <p id="pl-error" role="alert" class="text-destructive"></p>
</div>

<p class="footnote">Play the demo or choose a song. Audio stays on your device. Microphone audio is visualized without speaker playback.</p>
</main>
</body>
</html>
